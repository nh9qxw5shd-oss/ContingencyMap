<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contingency Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Floating top bar -->
  <div id="topbar">
    <div class="brand">
      <div class="brand-title">Contingency Map</div>
      <div class="brand-sub">Click a section of railway to view its contingency plans</div>
    </div>
    <div class="topbar-actions">
      <label class="chip toggle" title="Show the real railway layout (OpenRailwayMap)">
        <input type="checkbox" id="railOverlayToggle" checked />
        <span>Rail overlay</span>
      </label>
      <button class="chip" id="fitAllBtn" title="Zoom to all sections">Fit all</button>
      <button class="chip chip-accent" id="adminBtn">Admin</button>
    </div>
  </div>

  <!-- Viewer panel (right) -->
  <aside id="viewerPanel" class="panel panel-right" aria-hidden="true">
    <div class="panel-head">
      <div>
        <h2 id="viewerTitle">Section</h2>
        <div id="viewerMeta" class="meta"></div>
      </div>
      <button class="icon-btn" id="viewerCloseBtn" title="Close">×</button>
    </div>
    <div id="viewerBody" class="panel-body"></div>
  </aside>

  <!-- Admin panel (left) -->
  <aside id="adminPanel" class="panel panel-left" aria-hidden="true">
    <div class="panel-head">
      <div>
        <h2 id="adminTitle">Admin</h2>
        <div id="adminMeta" class="meta"></div>
      </div>
      <button class="icon-btn" id="adminCloseBtn" title="Close admin">×</button>
    </div>
    <div id="adminBody" class="panel-body"></div>
  </aside>

  <!-- Drawing instruction bar -->
  <div id="drawBar" class="hidden">
    <span id="drawBarText"></span>
    <span class="drawbar-btns">
      <button id="drawUndoBtn" class="chip">Undo</button>
      <button id="drawDoneBtn" class="chip chip-accent">Done</button>
      <button id="drawCancelBtn" class="chip">Cancel</button>
    </span>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script src="./assets/data.js"></script>
  <script src="./assets/viewer.js"></script>
  <script src="./assets/admin.js"></script>
</body>
</html>
